apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yml convert -o kompose
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: prepreps-db
  name: prepreps-db
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prepreps-db
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yml convert -o kompose
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: prepreps-db
    spec:
      containers:
        - args:
            - postgres
            - -c
            - max_connections=500
          envFrom:
            - configMapRef:
                name: backend--env
          image: postgres:16.15-alpine
          name: prepreps-db
          ports:
            - containerPort: 5432
              protocol: TCP
      restartPolicy: Always
