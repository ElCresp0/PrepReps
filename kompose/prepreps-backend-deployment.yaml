apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose.yml convert -o kompose
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: prepreps-backend
  name: prepreps-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: prepreps-backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose.yml convert -o kompose
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: prepreps-backend
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: backend--env
          image: prepreps-backend-image
          name: prepreps-backend
          ports:
            - containerPort: 3000
              protocol: TCP
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
